name: Native stereo canonicalization

on:
  pull_request:
    paths:
      - 'synkit/Graph/Canon/**'
      - 'synkit/Graph/Stereo/**'
      - 'Test/Graph/Canon/**'
      - 'Test/Graph/Stereo/**'
      - '.github/workflows/stereo-canon-cpp.yml'
      - 'CMakeLists.txt'
      - 'hatch_build.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepared-core:
    name: Standalone core (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify runner architecture
        shell: python
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          import os
          import platform

          assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.platform()
      - name: Build the standalone C++17 core
        run: >-
          cmake -S synkit/Graph/Canon/cpp -B canon-build -DCMAKE_BUILD_TYPE=Release
          -DSYNKIT_CANON_BUILD_EXAMPLES=ON -DSYNKIT_CANON_BUILD_TESTS=ON
      - run: cmake --build canon-build --config Release --parallel 2
      - run: ctest --test-dir canon-build -C Release --output-on-failure
      - name: Run the native example without importing SynKit
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          name = 'Release/canonical_graph.exe' if sys.platform == 'win32' else 'canonical_graph'
          result = subprocess.check_output([str((Path('canon-build') / name).resolve())], text=True)
          assert '40 bytes' in result
      - name: Install Python adapters and test tools
        run: python -m pip install -e . pytest
      - name: Verify native partitions, stereo families and reference regressions
        run: >-
          python -m pytest -q
          Test/Graph/Canon/test_native_core.py
          Test/Graph/Stereo/test_native_stereograph.py
          Test/Graph/Stereo/test_canonical_stereograph_determinism.py
          Test/Graph/Stereo/test_pairwise_stereoisomer_relations.py
