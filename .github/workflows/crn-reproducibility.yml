name: CRN research reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crn-reproducibility:
    name: CRN evidence and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native analysis headers
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy
      - name: Run offline CRN evidence contracts
        run: |
          python Experiment/CRN/run_all.py --quick --offline \
            --output-dir /tmp/crn-results --summary /tmp/crn-results/summary.json
          python Experiment/CRN/tools/check_reports.py /tmp/crn-results/summary.json
      - name: Run CRN regression tests
        run: python -m pytest Test/CRN Experiment/CRN/tests -q
      - name: Upload CRN evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crn-evidence
          path: /tmp/crn-results/
