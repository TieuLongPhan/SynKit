name: Build and publish conda packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: Check conda build on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          channels: conda-forge
          activate-environment: conda-build
          python-version: ${{ matrix.python-version }}

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda activate conda-build
          conda install -y -c conda-forge 'conda-build>=3.21'
          conda-build recipe --output-folder ./conda-bld

  release-package:
    name: Build release conda artifact
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          channels: conda-forge
          activate-environment: conda-build
          python-version: "3.12"

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda activate conda-build
          conda install -y -c conda-forge 'conda-build>=3.21'
          conda-build recipe --output-folder ./conda-bld

      - name: Upload conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-release-package
          path: |
            conda-bld/**/*.conda
            conda-bld/**/*.tar.bz2
          if-no-files-found: error

  publish:
    name: Publish release to Anaconda.org
    needs: release-package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          name: conda-release-package
          path: conda-packages

      - name: Install Anaconda client
        run: python -m pip install --upgrade anaconda-client

      - name: Upload to the SynKit owner channel
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          find conda-packages -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 |
            xargs -0 -n 1 anaconda -t "$ANACONDA_TOKEN" upload \
              --user tieulongphan --label main --no-progress
