name: Mapper native portability

on:
  pull_request:
    paths:
      - 'synkit/Chem/Mapper/**'
      - 'Test/Chem/Mapper/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'hatch_build.py'
      - 'scripts/check_package_artifacts.py'
      - '.github/workflows/mapper-cpp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepared-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build standalone dependency-free C++17 core
        run: cmake -S synkit/Chem/Mapper/solvers/native/cpp -B native-build -DCMAKE_BUILD_TYPE=Release -DSYNKIT_MAPPER_BUILD_EXAMPLES=ON
      - run: cmake --build native-build --config Release --parallel 2
      - name: Run standalone example and check the additive ABI
        shell: python
        run: |
          import ctypes
          import pathlib
          import subprocess
          import sys
          build = pathlib.Path('native-build')
          binary = build / ('Release/slap_graph.exe' if sys.platform == 'win32' else 'slap_graph')
          subprocess.run([str(binary.resolve())], check=True)
          name = 'Release/synkit_mapper.dll' if sys.platform == 'win32' else 'libsynkit_mapper.dylib' if sys.platform == 'darwin' else 'libsynkit_mapper.so'
          library = ctypes.CDLL(str((build / name).resolve()))
          assert library.synkit_mapper_core_abi() == 1
          library.synkit_mapper_capabilities.restype = ctypes.c_uint64
          assert library.synkit_mapper_capabilities() & (1 << 13)

  rdkit-reaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          activate-environment: mapper-cpp
          channels: conda-forge
      - name: Install separately versioned native chemistry SDK
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge 'librdkit-dev=2026.03.1' 'libboost-devel=1.90.0' eigen cmake cxx-compiler
          python -m pip install -e . pytest
      - name: Build and test the complete native reaction pipeline
        shell: bash -l {0}
        run: |
          cmake -S synkit/Chem/Mapper/solvers/native/cpp -B native-reaction -DCMAKE_BUILD_TYPE=Release -DSYNKIT_MAPPER_WITH_RDKIT=ON -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build native-reaction --parallel 2
          SYNKIT_CORE_LIBRARY="$PWD/native-reaction/libsynkit_mapper.so" SYNKIT_REACTION_LIBRARY="$PWD/native-reaction/libsynkit_mapper_reaction.so" python -m pytest Test/Chem/Mapper/native_core/test_reaction_cpp.py Test/Chem/Mapper/native_core/test_assignment.py -q

  ortools-pabs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -e . pytest
      - name: Install checksum-pinned optional C++ SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ortools.tar.gz" \
            https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
          echo "6f389320672cee00b78aacefb2bde33fef0bb988c3b2735573b9fffd1047fbda  $RUNNER_TEMP/ortools.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ortools"
          tar -xzf "$RUNNER_TEMP/ortools.tar.gz" -C "$RUNNER_TEMP/ortools" --strip-components=1
          echo "SYNKIT_ORTOOLS_DIR=$RUNNER_TEMP/ortools" >> "$GITHUB_ENV"
      - name: Build the production core with optional certified LP bounds
        shell: python
        run: |
          import os
          from pathlib import Path
          from synkit.Chem.Mapper._native.build import build_mapper_native
          library = build_mapper_native(
              Path(os.environ['RUNNER_TEMP']) / 'mapper-ortools',
              ortools_dir=os.environ['SYNKIT_ORTOOLS_DIR'],
          )
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'SYNKIT_CORE_LIBRARY={library}\n')
      - name: Check objective certificates, public classes and oracle-only builds
        run: |
          python -m pytest -q \
            Test/Chem/Mapper/native_core/test_build_contract.py \
            Test/Chem/Mapper/native_core/test_shared_core.py \
            Test/Chem/Mapper/native_core/test_pabs_mathematics.py \
            Test/Chem/Mapper/exact/test_native_shared_seed.py \
            Test/Chem/Mapper/test_implicit.py \
            Test/Chem/Mapper/test_implicit_h2.py \
            Test/Chem/Mapper/test_implicit_free_hydrogen.py
