name: Test, lint, and packages

on:
  push:
    branches: ["main", "staging", "mech", "stereo", "mapper", "mtg"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install flake8
      - name: Lint source and tests
        run: bash scripts/lint.sh

  test-lint:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: synkit-ci
          channels: conda-forge
          use-mamba: true

      - name: Locate pip cache
        id: pip-cache
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install project and test tools
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          conda install --yes --channel conda-forge cmake libboost-headers
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy

      - name: Verify native test prerequisites
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          from synkit.CRN._build import boost_include

          cmake = shutil.which("cmake")
          assert cmake is not None, "Native tests require CMake"
          boost = boost_include()
          assert boost is not None, "Exact CRN tests require installed Boost headers"
          print(f"Native CRN tests use Boost headers from {boost}")
          # Configuring lets CMake discover Xcode/MSVC without assuming that
          # a particular compiler executable is present on the shell's PATH.
          with tempfile.TemporaryDirectory(prefix="synkit-native-prerequisites-") as folder:
              subprocess.run([
                  cmake, "-S", str(Path("synkit/CRN/cpp").resolve()), "-B", folder,
                  "-DSYNKIT_CRN_EXACT=ON", "-DSYNKIT_CRN_BOOST_INCLUDE_DIR=" + str(boost),
              ], check=True)
          PY

      - name: Test
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          bash scripts/pytest.sh

  mapper-native:
    name: Native C++ kernels and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools and declared dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          g++ --version
          python -m pip install -e . build pytest
      - name: Build distributions and verify the installed kernel builder
        run: |
          python -m build --sdist --wheel
          python scripts/check_package_artifacts.py dist --native-smoke
          python -m synkit.Chem.Mapper.exact.native_build --output-dir /tmp/synkit-native
      - name: Run bounded native exactness and disk controls
        run: |
          python -m pytest -q \
            Test/Chem/Mapper/exact/test_native_minimum_shells.py \
            Test/Chem/Mapper/exact/test_disk_frontier.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy pytest-cov cmake
      - name: Measure test coverage
        run: |
          python -m pytest Test/ --cov=synkit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package-smoke:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Validate metadata and installed wheel
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist
