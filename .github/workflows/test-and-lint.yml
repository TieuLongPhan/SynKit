name: Test, lint, docs, and packages

on:
  push:
    branches: ["main", "staging", "mech", "stereo", "lwg", "mtg"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-lint:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: synkit-ci
          channels: conda-forge
          use-mamba: true

      - name: Install project and test tools
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install flake8 pytest

      - name: Lint
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          bash scripts/lint.sh

      - name: Test
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          bash scripts/pytest.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-cov
      - name: Measure test coverage
        run: |
          python -m pytest Test/ --cov=synkit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        env:
          SYNKIT_DOCS_OFFLINE: "1"
        run: bash scripts/build_doc.sh

  package-smoke:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Validate metadata and installed wheel
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist
