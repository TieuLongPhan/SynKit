name: Test, lint, and packages

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install flake8
      - name: Lint source and tests
        run: bash scripts/lint.sh

  test-lint:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}/build/conda-pkgs
      SYNKIT_TEST_NATIVE_CACHE: ${{ github.workspace }}/build/test-native-cache
      PYTEST_ADDOPTS: --durations=15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Conda packages
        id: conda-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA_PKGS_DIRS }}
          enableCrossOsArchive: true
          key: conda-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('environment.yml', 'pyproject.toml', '.github/workflows/test-and-lint.yml') }}
          restore-keys: |
            conda-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: synkit-ci
          channels: conda-forge
          use-mamba: true
          pkgs-dirs: ${{ env.CONDA_PKGS_DIRS }}

      - name: Locate pip cache
        id: pip-cache
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-

      - name: Install project and test tools
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          conda install --yes --channel conda-forge cmake libboost-headers
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy

      - name: Verify native test prerequisites
        id: native-tools
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import sys
          import tempfile
          from synkit.CRN._build import boost_include
          from synkit.CRN._native_build import _boost_digest, _configure

          cmake = shutil.which("cmake")
          assert cmake is not None, "Native tests require CMake"
          boost = boost_include()
          assert boost is not None, "Exact CRN tests require installed Boost headers"
          print(f"Native CRN tests use Boost headers from {boost}")
          with tempfile.TemporaryDirectory(prefix="synkit-native-prerequisites-") as folder:
              toolchain = _configure(Path(folder), Path("synkit/CRN/cpp").resolve(), None, boost)
          packages = [
              {name: record.get(name) for name in ("name", "version", "build", "sha256")}
              for path in sorted((Path(sys.prefix) / "conda-meta").glob("*.json"))
              for record in [json.loads(path.read_text())]
          ]
          build_environment = {
              name.upper(): value for name, value in os.environ.items()
              if name.upper().startswith((
                  "CMAKE_", "CXX", "CPP", "CFLAGS", "LDFLAGS", "VSCMD_",
                  "VCTOOLS", "WINDOWSSDK", "UNIVERSALCRT", "UCRT",
              ))
              or name.upper() in {
                  "CC", "CL", "_CL_", "INCLUDE", "LIB", "LIBPATH", "SDKROOT",
                  "MACOSX_DEPLOYMENT_TARGET", "IMAGEOS", "IMAGEVERSION",
              }
          }
          identity = {
              "toolchain": toolchain, "boost": _boost_digest(boost), "packages": packages,
              "environment": build_environment, "python": sys.version, "machine": platform.machine(),
          }
          key = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key={key}\n")
          PY

      - name: Cache verified native test builds
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SYNKIT_TEST_NATIVE_CACHE }}
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ steps.native-tools.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'synkit/**/*.py', 'synkit/**/*.cpp', 'synkit/**/*.c', 'synkit/**/*.h', 'synkit/**/*.hpp', 'synkit/**/*.inc', 'synkit/**/*.cmake', 'synkit/**/CMakeLists.txt', 'Test/conftest.py', '.github/workflows/test-and-lint.yml') }}

      - name: Test
        shell: bash -l {0}
        run: |
          conda activate synkit-ci
          bash scripts/pytest.sh

      - name: Save Conda downloads
        if: ${{ !cancelled() && steps.conda-cache.outputs.cache-hit != 'true' && steps.conda-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CONDA_PKGS_DIRS }}
          enableCrossOsArchive: true
          key: ${{ steps.conda-cache.outputs.cache-primary-key }}

      - name: Save verified native test builds
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SYNKIT_TEST_NATIVE_CACHE }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  mapper-native:
    name: Native C++ kernels and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools and declared dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          g++ --version
          python -m pip install -e . build pytest
      - name: Build distributions and verify the installed kernel builder
        run: |
          python -m build --sdist --wheel
          python scripts/check_package_artifacts.py dist --native-smoke
          python -m synkit.Chem.Mapper.exact.native_build --output-dir /tmp/synkit-native
      - name: Run bounded native exactness and disk controls
        run: |
          python -m pytest -q \
            Test/Chem/Mapper/exact/test_native_minimum_shells.py \
            Test/Chem/Mapper/exact/test_disk_frontier.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' sympy pytest-cov cmake
      - name: Measure test coverage
        run: |
          python -m pytest Test/ Experiment/CRN/tests --cov=synkit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package-smoke:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Validate metadata and installed wheel
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist
