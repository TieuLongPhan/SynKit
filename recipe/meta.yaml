package:
  name: synkit
  version: "1.6.5"

source:
  path: ..

build:
  noarch: python
  number: 0
  script:
    # pip will invoke Hatchling to build and install the wheel, including data files
    - "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - hatchling >=1.27.0       # PEP517 build backend
  run:
    - python >=3.11,<3.13
    - scikit-learn >=1.4.2
    - pandas >=2.2.2
    - rdkit >=2025.3.1
    - networkx >=3.3
    - scipy >=1.14.0
    - seaborn >=0.13.2
    - requests >=2.32.3
    - regex >=2024.11.6
    - numpy >=2.2.0
    - sympy >=1.13.1
    - joblib >=1.2.0
    - matplotlib-base >=3.9
    - pillow
    - tqdm

about:
  home:        https://github.com/TieuLongPhan/SynKit
  license:     MIT
  license_file: LICENSE
  summary:     Utility for reaction modeling using graph grammar

extra:
  recipe-maintainers:
    - TieuLongPhan
