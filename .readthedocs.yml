# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  apt_packages:
    # Required by the native CRN library when pip builds the SynKit wheel.
    - libboost-dev
  tools:
    python: "3.11"

python:
  install:
    - method: pip
      path: .
      extra_requirements: 
        - docs

sphinx:
  configuration: doc/conf.py
  builder: html
